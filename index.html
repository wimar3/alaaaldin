<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تفعيل الحساب — علاء الدين</title>

  <style>
    :root{
      --aladdin-green: #004D40;
      --bg: #f6fbf7;
      --card: #ffffff;
      --muted: #6b7280;
      --radius: 14px;
      --max-width: 720px;
      font-family: "Tajawal", "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html,body{
      height:100%;
      margin:0;
      background: linear-gradient(180deg, var(--bg), #eef7ee);
      color:#111827;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .card{
      width:100%;
      max-width:var(--max-width);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: 0 8px 30px rgba(2,6,23,0.08);
      padding:36px;
      text-align:center;
    }

    .logo{
      width:110px;
      height:110px;
      object-fit:contain;
      margin-bottom:20px;
    }

    h1{
      margin:6px 0 8px 0;
      font-size:24px;
      line-height:1.3;
      color:#004D40;
      font-weight:800;
    }

    p.lead{
      margin:0 0 18px 0;
      color:#333;
      font-size:17px;
      font-weight:600;
    }

    .success-pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      border-radius:999px;
      background: rgba(0, 77, 64, 0.10);
      color: var(--aladdin-green);
      font-weight:600;
      font-size:15px;
      box-shadow: inset 0 0 0 1px rgba(0,77,64,0.18);
      margin:20px 0;
    }

    .note{
      margin-top:14px;
      color:#6b7280;
      font-size:14px;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div class="card">

      <img 
        src="https://qgwlcuxrudvdnmryajza.supabase.co/storage/v1/object/public/logo/logo.png"
        alt="شعار علاء الدين"
        class="logo">

      <h1>شكراً لاختيارك علاء الدين</h1>

      <p class="lead">تم تفعيل حسابك بنجاح</p>

      <div class="success-pill">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M8.5 13.5L4.5 9.5L5.646 8.354L8.5 11.207L14.354 5.354L15.5 6.5L8.5 13.5Z"
                fill="currentColor"/>
        </svg>
        التفعيل مكتمل
      </div>

      <p class="note">
        يمكنك الآن العودة إلى التطبيق وتسجيل الدخول.
      </p>

    </div>
  </div>
</body>
</html>
